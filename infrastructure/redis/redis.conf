# Redis Configuration for BullMQ Durable Queues
# Invariant: Never evict BullMQ keys under memory pressure
maxmemory-policy noeviction

# Durability & Persistence
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Network
bind 0.0.0.0
protected-mode no
port 6379

# Logging
loglevel notice
